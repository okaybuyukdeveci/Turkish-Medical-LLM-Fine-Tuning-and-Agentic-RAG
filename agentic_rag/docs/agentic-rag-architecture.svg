<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Turkish Medical Agentic RAG architecture</title>
  <desc id="desc">Markdown documents are chunked and indexed in Qdrant, then a LangGraph responder retrieves, prunes, answers, and compacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.agent{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}
      .label{font:16px sans-serif;fill:#0f172a;text-anchor:middle}.heading{font:bold 24px sans-serif;fill:#0f172a;text-anchor:middle}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="38" class="heading">Turkish Medical Agentic RAG</text>
  <rect x="25" y="75" width="1150" height="150" fill="#f8fafc" stroke="#94a3b8" rx="14"/>
  <text x="105" y="104" class="label">Indexing</text>
  <rect x="65" y="125" width="155" height="58" class="box"/><text x="142" y="160" class="label">data/*.md</text>
  <rect x="280" y="125" width="190" height="58" class="box"/><text x="375" y="150" class="label"># / ## parsing</text><text x="375" y="170" class="label">+ cleanup</text>
  <rect x="530" y="125" width="190" height="58" class="box"/><text x="625" y="150" class="label">384-token chunks</text><text x="625" y="170" class="label">with heading context</text>
  <rect x="780" y="125" width="155" height="58" class="box"/><text x="857" y="150" class="label">E5 passage</text><text x="857" y="170" class="label">embeddings</text>
  <rect x="995" y="125" width="140" height="58" class="box"/><text x="1065" y="160" class="label">Qdrant</text>
  <path d="M220 154H280M470 154H530M720 154H780M935 154H995" class="line"/>
  <rect x="25" y="265" width="1150" height="220" fill="#f8fafc" stroke="#94a3b8" rx="14"/>
  <text x="112" y="295" class="label">LangGraph</text>
  <rect x="65" y="345" width="145" height="58" class="agent"/><text x="137" y="380" class="label">Responder</text>
  <rect x="270" y="345" width="165" height="58" class="agent"/><text x="352" y="380" class="label">Retrieval Tool</text>
  <rect x="495" y="345" width="145" height="58" class="agent"/><text x="567" y="380" class="label">Pruner</text>
  <rect x="700" y="345" width="145" height="58" class="agent"/><text x="772" y="380" class="label">Responder</text>
  <rect x="905" y="345" width="145" height="58" class="agent"/><text x="977" y="380" class="label">Compactor</text>
  <path d="M210 374H270M435 374H495M640 374H700M845 374H905" class="line"/>
  <path d="M1065 183V250H352V345" class="line"/>
  <text x="600" y="456" class="label">Source-labelled evidence → grounded Turkish educational answer</text>
</svg>
